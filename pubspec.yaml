name: mindmentor
description: "MindMentor — A premium AI-powered mental well-being companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # UI Utilities
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  shimmer: ^3.0.0

  # HTTP
  http: ^1.3.0

  # URL Launcher (for emergency 988 calls)
  url_launcher: ^6.3.1

  # Telemetry & Crash Reporting
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ── Launcher Icon Configuration ────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1A1D2E"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21

# ── Native Splash Screen Configuration ─────────────────
flutter_native_splash:
  color: "#FAF8F5"
  color_dark: "#1A1D2E"
  android: true
  ios: true
  android_12:
    color: "#FAF8F5"

